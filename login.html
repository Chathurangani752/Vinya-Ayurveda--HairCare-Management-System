
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>
<body>

    <!-- Login Form -->
    <div id="loginPage">

        <h1>Welcome Back!</h1>
        <p>Please login to your account</p>

        <form>
            <label for="loginEmail">Email</label><br>
            <input type="email" id="loginEmail" required>
            <br><br>

            <label for="loginPassword">Password</label><br>
            <input type="password" id="loginPassword" required>
            <br><br>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?</p>
        <button type="button" onclick="showRegister()">
            Create Account
        </button>

    </div>


    <!-- Registration Form -->
    <div id="registerPage" hidden>

        <h1>Create Account</h1>
        <p>Register to get started</p>

        <form>
            <label for="fullName">Full Name</label><br>
            <input type="text" id="fullName" required>
            <br><br>

            <label for="registerEmail">Email</label><br>
            <input type="email" id="registerEmail" required>
            <br><br>

            <label for="registerPassword">Password</label><br>
            <input type="password" id="registerPassword" required>
            <br><br>

            <label for="confirmPassword">Confirm Password</label><br>
            <input type="password" id="confirmPassword" required>
            <br><br>

            <button type="submit">Register</button>
        </form>

        <p>Already have an account?</p>
        <button type="button" onclick="showLogin()">
            Back to Login
        </button>

    </div>


    <!-- JavaScript -->
    <script>
        function showRegister() {
            document.getElementById("loginPage").hidden = true;
            document.getElementById("registerPage").hidden = false;
        }

        function showLogin() {
            document.getElementById("registerPage").hidden = true;
            document.getElementById("loginPage").hidden = false;
        }
    </script>

</body>
</html>
